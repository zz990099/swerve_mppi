name: CMake core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout current chassis mechanics for offline parity
        uses: actions/checkout@v4
        with:
          repository: zz990099/swerve_gazebo_sim
          ref: 9358c96884d7fa4866cea7c053daa7a7cec82d8f
          path: companion-chassis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ROS Rolling format tools
        run: python -m pip install -r tools/requirements-format.txt
      - name: Check ROS format
        run: python tools/format.py --check
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DSWERVE_MPPI_BUILD_BENCHMARKS=ON
          -DSWERVE_MPPI_BUILD_FORMAT_TESTS=ON
          -DSWERVE_MPPI_CHASSIS_SOURCE_DIR=${{ github.workspace }}/companion-chassis
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and installed consumer
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Check planning, model and configuration under UBSan (Debug)
        if: matrix.build_type == 'Debug'
        run: |
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Werror -fsanitize=undefined -fno-sanitize-recover=all"
          cmake --build build-ubsan --target swerve_mppi_command_tests swerve_mppi_configuration_tests swerve_mppi_timing_tests swerve_mppi_current_chassis_tests swerve_mppi_safety_tests swerve_mppi_model_tests --parallel 2
          ctest --test-dir build-ubsan -R 'command_regressions|configuration_regressions|timing_regressions|current_chassis_regressions|safety_regressions|model_regressions' --output-on-failure

      - name: Record independent motion probes (Release)
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p build/motion-probe
          git rev-parse HEAD > build/motion-probe/source-commit.txt
          cp build/CMakeCache.txt build/motion-probe/CMakeCache.txt
          build/swerve_mppi_model_probe --print-config > build/motion-probe/resolved.conf
          build/swerve_mppi_model_probe --config build/motion-probe/resolved.conf > build/motion-probe/calls.csv
          python tools/summarize_motion_probe.py build/motion-probe/calls.csv > build/motion-probe/report.md
          tee -a "$GITHUB_STEP_SUMMARY" < build/motion-probe/report.md
          sha256sum build/swerve_mppi_model_probe build/motion-probe/resolved.conf build/motion-probe/calls.csv > build/motion-probe/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always() && matrix.build_type == 'Release'
        with:
          name: motion-probe
          path: build/motion-probe/

      - name: Record planner performance (Release)
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p build/planner-performance
          git rev-parse HEAD > build/planner-performance/source-commit.txt
          cp build/CMakeCache.txt build/planner-performance/CMakeCache.txt
          build/swerve_mppi_benchmark curve 42 > build/planner-performance/curve.csv
      - uses: actions/upload-artifact@v4
        if: always() && matrix.build_type == 'Release'
        with:
          name: planner-performance
          path: build/planner-performance/
