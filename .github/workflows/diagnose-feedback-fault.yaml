name: Diagnose chassis feedback faults with the published simulation image
on:
  push:
    branches: [diagnostics/pr9-feedback-image]
permissions:
  contents: read
  packages: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    container:
      image: ghcr.io/zz990099/swerve_mppi:jazzy-test-sha-794e6e0cb5378d8117335024f7369d16a38f6778
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: '83'
      MPLBACKEND: Agg
      GZ_PARTITION: pr9-feedback-${{ github.run_id }}-${{ matrix.repetition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zz990099/swerve_gazebo_sim
          ref: ec25fdb029749bea3dff9ad616475dcb2fe58ac2
          path: companion-chassis
      - name: List the preinstalled ROS simulation packages
        run: dpkg-query -W ros-jazzy-gz-ros2-control ros-jazzy-joint-state-broadcaster ros-jazzy-ros-gz-bridge
      - name: Add pre-latch feedback fault diagnostics to the CI build
        run: python3 tools/diagnostics/trace_feedback_fault.py
      - name: Build chassis and MPPI
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths swerve_mppi_core swerve_mppi_ros companion-chassis --packages-up-to swerve_mppi_ros --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror -DBUILD_TESTING=OFF
      - name: Record one continuous 100 m physical route / seed 42
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/local_setup.bash
          python3 swerve_mppi_ros/tests/run_long_route.py --chassis-root companion-chassis --output artifacts
      - name: Show first fault occurrences
        if: always()
        run: |
          if test -f artifacts/realistic_100m/gazebo.log; then
            grep -En 'FEEDBACK_FAULT|Rejected cmd_vel|stale or missing' artifacts/realistic_100m/gazebo.log || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mppi-feedback-fault-${{ matrix.repetition }}
          path: artifacts/
          if-no-files-found: warn
