name: CMake core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DSWERVE_MPPI_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and installed consumer
        run: ctest --test-dir build --output-on-failure

      - name: Record production integration budget (Release)
        if: matrix.build_type == 'Release'
        run: ./build/swerve_mppi_integration_budget 12 > build/integration-budget.csv
      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: integration-budget
          path: build/integration-budget.csv
