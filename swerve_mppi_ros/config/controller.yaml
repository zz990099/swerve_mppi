controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    publish_zero_velocity: true
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.1
      required_movement_angle: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: swerve_mppi_ros::OrderedGoalChecker
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.05
      trans_stopped_velocity: 0.035
      rot_stopped_velocity: 0.035
      settle_time: 0.3
    FollowPath:
      plugin: swerve_mppi_ros::Nav2Controller
      state_topic: chassis_controller/state
      context_topic: mppi/command_context
      state_timeout: 0.25
      transform_tolerance: 0.1
      use_costmap: true
      unknown_is_obstacle: true
      horizon: 30
      model_dt: 0.1
      integration_dt: 0.01
      samples: 64
      iterations: 1
      max_speed: 0.8
      max_yaw_rate: 0.8
      minimum_mode_dwell: 1.0
      switch_penalty: 0.3
      switch_hysteresis: 0.15

# Obstacle-free FollowPath test costmap. Add sensors/static and inflation layers
# for navigation; these defaults do not populate real obstacles.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 2.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.45
      track_unknown_space: false
      plugins: [inflation_layer]
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

mppi_chassis_bridge:
  ros__parameters:
    use_sim_time: true
    body_frame: base_footprint
    state_topic: chassis_controller/state
    context_topic: mppi/command_context
    cmd_vel_topic: cmd_vel
    command_topic: chassis_controller/command
    enable_stamped_cmd_vel: true
    command_timeout: 0.25
    publish_frequency: 20.0
