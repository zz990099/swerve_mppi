name: Replay chassis clock skew
on:
  push:
    branches: [diagnostics/chassis-command-fault]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    env:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: '83'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zz990099/swerve_gazebo_sim
          ref: 8f986bda64d5b48af012d37cf924328e0b127468
          path: companion-chassis
      - run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3-colcon-common-extensions ros-jazzy-rosidl-default-generators
      - name: Build the benchmark chassis
        run: |
          python3 tools/diagnostics/trace_chassis_fault.py
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths companion-chassis --packages-up-to swerve_chassis_controller --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror -DBUILD_TESTING=OFF
      - name: Replay future and repeated timestamps
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/local_setup.bash
          python3 -u tools/diagnostics/clock_race_probe.py
