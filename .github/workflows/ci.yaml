name: CMake core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ROS Rolling format tools
        run: python -m pip install -r tools/requirements-format.txt
      - name: Check ROS format
        run: python tools/format.py --check
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DSWERVE_MPPI_BUILD_BENCHMARKS=ON
          -DSWERVE_MPPI_BUILD_FORMAT_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and installed consumer
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Check adapter contract under UBSan (Debug)
        if: matrix.build_type == 'Debug'
        run: |
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Werror -fsanitize=undefined -fno-sanitize-recover=all"
          cmake --build build-ubsan --target swerve_mppi_adapter_tests swerve_mppi_configuration_tests --parallel 2
          ctest --test-dir build-ubsan -R 'adapter_regressions|configuration_regressions' --output-on-failure

      - name: Record independent motion probes (Release)
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p build/motion-probe
          git rev-parse HEAD > build/motion-probe/source-commit.txt
          cp build/CMakeCache.txt build/motion-probe/CMakeCache.txt
          build/swerve_mppi_model_probe --print-config > build/motion-probe/resolved.conf
          build/swerve_mppi_model_probe --config build/motion-probe/resolved.conf > build/motion-probe/calls.csv
          python tools/summarize_motion_probe.py build/motion-probe/calls.csv > build/motion-probe/report.md
          tee -a "$GITHUB_STEP_SUMMARY" < build/motion-probe/report.md
          sha256sum build/swerve_mppi_model_probe build/motion-probe/resolved.conf build/motion-probe/calls.csv > build/motion-probe/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always() && matrix.build_type == 'Release'
        with:
          name: motion-probe
          path: build/motion-probe/

      - name: Record production integration budget (Release)
        if: matrix.build_type == 'Release'
        run: >-
          python tools/run_budget_matrix.py
          --executable build/swerve_mppi_integration_budget
          --output-dir build/integration-budget
          --repetitions 50 --budget-ratio 0.6
      - name: Publish workload summary
        if: always() && matrix.build_type == 'Release'
        run: |
          if test -f build/integration-budget/report.md; then
            tee -a "$GITHUB_STEP_SUMMARY" < build/integration-budget/report.md
          fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.build_type == 'Release'
        with:
          name: integration-budget
          path: build/integration-budget/
