name: CMake core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ROS Rolling format tools
        run: python -m pip install -r tools/requirements-format.txt
      - name: Check ROS format
        run: python tools/format.py --check
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS=-Werror
          -DSWERVE_MPPI_BUILD_BENCHMARKS=ON
          -DSWERVE_MPPI_BUILD_FORMAT_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test core and installed consumer
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Record production integration budget (Release)
        if: matrix.build_type == 'Release'
        run: |
          ./build/swerve_mppi_integration_budget 50 --budget-ratio 0.6 --write-config build/integration-budget.conf > build/integration-budget.csv
          ./build/swerve_mppi_integration_budget 50 --config build/integration-budget.conf --path-points 4096 > build/integration-budget-dense.csv
      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: integration-budget
          path: |
            build/integration-budget.csv
            build/integration-budget-dense.csv
            build/integration-budget.conf
