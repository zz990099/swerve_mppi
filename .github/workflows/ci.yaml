name: Core and path following
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zz990099/swerve_gazebo_sim
          ref: 0894bd1ad765d1c68bbe16f869f3e294c9c4e509
          path: companion-chassis
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and format dependencies
        run: python -m pip install pyyaml -r tools/requirements-format.txt
      - name: Check format
        run: python tools/format.py --check
      - name: Offline recording and actuator audits
        if: matrix.build_type == 'Release'
        run: python -m unittest discover -s swerve_mppi_ros/tests -p 'test_*.py' -v
      - name: Standalone core and installed consumer
        run: |
          cmake -S companion-chassis/swerve_chassis_core -B build-chassis -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install-chassis"
          cmake --build build-chassis --parallel 2
          cmake --install build-chassis
          cmake -S swerve_mppi_core -B build -DCMAKE_PREFIX_PATH="$PWD/install-chassis" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS=-Werror
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          cmake --install build --prefix "$PWD/install-core"
      - name: Caller contracts and continuous execution closed loops
        if: matrix.build_type == 'Release'
        run: |
          cmake -S swerve_mppi_ros/tests/portable -B build-support -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror -DCMAKE_PREFIX_PATH="$PWD/install-core;$PWD/install-chassis"
          cmake --build build-support --parallel 2
          ctest --test-dir build-support --output-on-failure --verbose
  ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
    env:
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: '83'
      GZ_PARTITION: swerve-mppi-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zz990099/swerve_gazebo_sim
          ref: 0894bd1ad765d1c68bbe16f869f3e294c9c4e509
          path: companion-chassis
      - name: Install Jazzy and Harmonic dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake python3-colcon-common-extensions python3-psutil ros-jazzy-ament-cmake-gtest ros-jazzy-ament-cmake-pytest ros-jazzy-ament-cmake-python ros-jazzy-rosidl-default-generators python3-pytest ros-jazzy-tf2-geometry-msgs ros-jazzy-nav2-controller ros-jazzy-nav2-lifecycle-manager ros-jazzy-ros-gz ros-jazzy-gz-ros2-control ros-jazzy-joint-state-broadcaster ros-jazzy-forward-command-controller ros-jazzy-robot-state-publisher ros-jazzy-xacro
      - name: Build chassis and MPPI packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths swerve_mppi_core swerve_mppi_ros companion-chassis --packages-up-to swerve_mppi_ros --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror -DBUILD_TESTING=ON
      - name: Test continuous Nav2 lifecycle and state contracts
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/local_setup.bash
          colcon test --packages-select swerve_mppi_ros --return-code-on-test-failure --event-handlers console_direct+
          colcon test-result --all --verbose
      - name: Physical MPPI path following
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/local_setup.bash
          python3 swerve_mppi_ros/tests/run_gazebo.py --chassis-root companion-chassis --logs artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jazzy-validation
          path: |
            artifacts/
            log/
            build/swerve_mppi_ros/test_results/
